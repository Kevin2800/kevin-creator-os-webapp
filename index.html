<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html.g{background:var(--grp)}body{background:transparent}
#bg{position:fixed;inset:-10%;z-index:0;pointer-events:none;background-size:130% 130%;animation:drift 24s ease-in-out infinite alternate;background:radial-gradient(60% 34% at 10% 62%,rgba(37,211,102,.26),transparent 70%),radial-gradient(52% 34% at 92% 66%,rgba(70,110,255,.28),transparent 70%),radial-gradient(50% 30% at 75% 8%,rgba(37,211,102,.16),transparent 70%)}
#app{position:relative;z-index:1;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.nopad{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}
header.l{padding:6px 16px 4px}.l .top{display:flex;justify-content:flex-end;height:40px;align-items:center}
.l h1{font-size:34px;font-weight:700;margin:0 0 8px;letter-spacing:-.3px}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:#fff;font-size:24px;line-height:30px;padding:0}
.srch{width:100%;border:0;border-radius:10px;background:var(--inp);color:var(--tx);padding:9px 12px;font:inherit;font-size:16px;margin-bottom:8px}
header.n{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;height:44px;padding:0 8px;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
header.n .t{text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{background:none;border:0;color:var(--tintd);font:inherit;padding:8px;text-align:left}.nb.r{text-align:right;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}.row:active{background:var(--grp)}
.av{width:50px;height:50px;border-radius:50%;flex:none;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:17px}
.mid{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding:6px 0 10px;margin-bottom:-10px;display:flex;justify-content:space-between;gap:8px}
.mid>div{min-width:0}.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small,.sub{display:block;color:var(--mute);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;color:var(--tintd);white-space:nowrap;align-self:flex-start;margin-top:3px}
.empty{padding:40px 32px;text-align:center;color:var(--mute);font-size:15px}
.gt{margin:22px 32px 7px;font-size:13px;color:var(--mute);text-transform:uppercase}
.grp{background:var(--cell);border-radius:12px;margin:0 16px;overflow:hidden}
.grp>.c{padding:10px 16px;border-bottom:.5px solid var(--sep);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.grp>.c:last-child{border-bottom:0}.grp>.c.tap{cursor:pointer}.grp>.c.tap:active{background:var(--grp)}
.ch::after{content:"›";color:var(--mute);font-size:22px;margin-left:8px}
.f{display:block;padding:8px 16px 10px;border-bottom:.5px solid var(--sep);background:var(--cell)}.f:last-child{border:0}
.f span{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.f input,.f textarea,.f select{width:100%;border:0;background:none;color:var(--tx);font:inherit;padding:2px 0;outline:0;resize:vertical}
.btn{display:block;width:calc(100% - 32px);margin:16px;border:0;border-radius:12px;background:var(--tint);color:#fff;font:inherit;font-weight:600;padding:13px}
.link{background:none;border:0;color:var(--tintd);font:inherit;padding:0;flex:none;white-space:nowrap}.grp>.c>span{flex:1;min-width:0}.grp .sub{white-space:normal}.red{color:var(--red)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.62);-webkit-backdrop-filter:blur(20px) saturate(200%) brightness(1.04);backdrop-filter:blur(20px) saturate(200%) brightness(1.04);box-shadow:0 12px 32px rgba(0,0,0,.22),inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -1px 2px rgba(255,255,255,.3)}
html.wpc .glass{background-color:rgba(var(--wp),.14);border-color:rgba(var(--wp),.55)}
#bg.img{animation:none;inset:0;opacity:1!important}#bg.img::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55)}
@media all{.glass{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05)),rgba(28,28,30,.26);border-color:rgba(255,255,255,.3);box-shadow:0 12px 32px rgba(0,0,0,.55),inset 0 1.5px 1px rgba(255,255,255,.4),inset 0 -1px 2px rgba(255,255,255,.1)}
.tabs button.on,.tabs .orb.on{color:#fff}#bg.img::after{background:rgba(0,0,0,.5)}#bg{opacity:.65}.sk{background-image:linear-gradient(90deg,var(--cell),rgba(255,255,255,.07),var(--cell))}}

:root{--ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.5,.64,1)}
body{touch-action:manipulation}
.tabs button{z-index:1}.tabs.hide{transform:translateY(140%) scale(.9);opacity:0;pointer-events:none}
button,.row,.c{position:relative}
button,.row,.c.tap,.plus{transition:transform .45s var(--spring),opacity .2s,background .2s}
button:active,.c.tap:active,.plus:active{transform:scale(.94)}.row:active{transform:scale(.985)}.tabs button:active{transform:scale(.88)}
.pg.in{animation:pin .6s var(--ease) both}.pg.out{animation:pout .5s var(--ease) both}.pg.fade{animation:pfade .4s var(--ease) both}
@keyframes pin{from{transform:translate3d(36%,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes pout{from{transform:translate3d(-16%,0,0);opacity:0}to{transform:none;opacity:1}}
@keyframes pfade{from{opacity:0;transform:translate3d(0,10px,0) scale(.99)}to{opacity:1;transform:none}}
@keyframes drift{from{background-position:0% 0%}to{background-position:100% 100%}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sh{to{background-position:-200% 0}}@keyframes pb{to{transform:translateX(100%)}}
button.busy{pointer-events:none;color:transparent!important}
button.busy::after,.row.busy::after,.c.busy::after{content:"";position:absolute;width:18px;height:18px;border:2.5px solid rgba(128,128,128,.35);border-top-color:var(--tint);border-radius:50%;animation:spin .7s linear infinite}
button.busy::after{inset:0;margin:auto}.btn.busy::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
.row.busy,.c.busy{pointer-events:none;opacity:.6}.row.busy::after,.c.busy::after{right:16px;top:50%;margin-top:-9px}
#pb{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:linear-gradient(90deg,transparent,var(--tint),transparent);opacity:0;transform:translateX(-100%);pointer-events:none;transition:opacity .3s}
#pb.on{opacity:1;animation:pb 1.1s var(--ease) infinite}
.sk{height:64px;margin:10px 16px;border-radius:14px;background:linear-gradient(90deg,var(--cell),rgba(0,0,0,.07),var(--cell));background-size:200% 100%;animation:sh 1.3s linear infinite}
@media(prefers-reduced-motion:reduce){.pg,#bg,.sk,#pb.on{animation:none!important}button,.row,.c,.tabs{transition:none!important}}
#msg{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));padding:12px 14px;border-radius:14px;display:none;z-index:99;font-size:15px;backdrop-filter:blur(20px)}
#msg.e{display:block;background:#ff3b30;color:#fff}#msg.o{display:block;background:var(--tint);color:#fff}
.lg{max-width:360px;margin:0 auto;padding:12vh 24px 24px;text-align:center}.lg h1{font-size:26px;margin:18px 0 6px}.lg p{color:var(--mute);margin:0 0 20px;font-size:15px}
.lg .f{border-radius:12px;margin-bottom:10px;text-align:left}.lg .btn{width:100%;margin:6px 0}.lg .link{margin-top:10px;font-size:16px}

:root{--gl:rgba(255,255,255,.58);--gb:rgba(255,255,255,.7);--gsh:0 6px 24px rgba(0,0,0,.07);--act:rgba(120,120,128,.14);--wl:38%}
@media all{:root{--gl:rgba(34,34,36,.5);--gb:rgba(255,255,255,.1);--gsh:0 8px 28px rgba(0,0,0,.3);--wl:70%}}
#app{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.nopad{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}

/* card: kaca tipis, minimalis */
.grp{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:.5px solid var(--gb);border-radius:18px;box-shadow:var(--gsh)}
.grp>.c{padding:12px 16px;border-bottom-color:rgba(128,128,128,.22)}
.grp>.c.tap:active,.row:active{background:var(--act)}
.f{background:transparent;border-bottom-color:rgba(128,128,128,.22)}
.lg .f{background:var(--gl);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:.5px solid var(--gb);border-radius:14px}
.grp .sub{font-size:14px}
header.n{background:rgba(249,249,249,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
@media all{header.n{background:rgba(18,18,18,.6)}}

/* badge status */
.pill{font-size:11.5px;font-weight:500;color:var(--tintd);background:rgba(200,176,122,.14);background:color-mix(in srgb,var(--tint) 16%,transparent);padding:3px 10px;border-radius:999px;align-self:center;margin-top:0;white-space:nowrap}

/* tab bar */
.tabs{position:fixed;z-index:10;left:22px;right:22px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;transition:transform .6s var(--ease),opacity .3s}
.pw{position:relative;flex:1;height:54px}
.tp{position:absolute;inset:0;border-radius:999px}
.tb{position:relative;z-index:3;display:flex;height:100%;padding:4px}
.tabs .tb button{flex:1;min-width:0;background:none;border:0;border-radius:999px;color:var(--tx);opacity:.66;font:500 10px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.tabs .tb button.on{opacity:1;color:var(--tintd)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .orb{flex:none;width:54px;height:54px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:.9}
.tabs .orb svg{width:23px;height:23px}
.tabs .orb.on{opacity:1;color:var(--tintd);border-color:rgba(255,255,255,.85)}
.tabs .glass{box-shadow:0 8px 22px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 2px rgba(255,255,255,.25)}
/* lensa tab aktif: bening seperti tetes air, teks tetap tajam karena berada di atas lensa */
.lens{position:absolute;left:-1px;top:-3px;bottom:-3px;width:calc((100% - 8px)/4 + 10px);border-radius:999px;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 55%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.5);-webkit-backdrop-filter:saturate(170%) brightness(1.1);backdrop-filter:saturate(170%) brightness(1.1);box-shadow:0 6px 16px rgba(0,0,0,.14),inset 0 1px 1px rgba(255,255,255,.75),inset 0 -1px 2px rgba(255,255,255,.3),inset 2px 0 4px -1px rgba(255,255,255,.3),inset -2px 0 4px -1px rgba(255,255,255,.25);transform:translateX(calc(var(--i,0)*(100% - 10px)));transition:opacity .3s}
.lens.off{opacity:0}
html.fx .lens{-webkit-backdrop-filter:url(#lensfx) saturate(170%) brightness(1.1);backdrop-filter:url(#lensfx) saturate(170%) brightness(1.1)}
@media all{
.tabs .tb button.on,.tabs .orb.on{color:#fff}
.tabs .glass{box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 1px rgba(255,255,255,.08)}
.lens{border-color:rgba(255,255,255,.4)}}

/* tab script */
.vt{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.vt::-webkit-scrollbar{display:none}
.vt .vtb{flex:none;padding:6px 12px;border-radius:999px;border:.5px solid var(--gb);background:var(--gl);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--tx);font-size:14px;font-weight:500}
.vt .vtb.on{background:var(--tint);color:#fff;border-color:transparent}

/* isi script */
.scr{margin:0 16px;display:flex;flex-direction:column;gap:14px;line-height:1.5}
.sbox,.scn{background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:.5px solid var(--gb);border-radius:18px;box-shadow:var(--gsh);padding:12px 14px}
.s-h{font-weight:600;font-size:14px;color:var(--mute);margin:10px 0 4px}.s-h:first-child{margin-top:0}
.s-kv{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:7px 0;border-bottom:.5px solid rgba(128,128,128,.2)}
.s-kv:last-child{border-bottom:0}
.s-k{color:var(--mute);font-size:13.5px;padding-top:1px}.s-v{font-size:15.5px;word-break:break-word}
.s-p,.s-ln{margin:0;font-size:15.5px;word-break:break-word}.s-ln{padding:2px 0}.s-li{padding:2px 0 2px 16px;text-indent:-16px;font-size:15.5px}
.s-gap{height:8px}
.scn{display:flex;flex-direction:column;gap:10px}
.scn-h{display:flex;justify-content:space-between;align-items:center;gap:10px}.scn-h b{font-size:17px}
.s-tm{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--tintd);background:rgba(200,176,122,.14);background:color-mix(in srgb,var(--tint) 16%,transparent);padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-loc{color:var(--mute);font-size:14px;margin-top:-6px}
.blk{--bc:#8e8e93;border-radius:12px;padding:9px 12px;border-left:3px solid var(--bc);background:rgba(142,142,147,.12);background:color-mix(in srgb,var(--bc) 12%,transparent)}
.blk .bt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--bc);margin-bottom:3px}
.blk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blk p{margin:0;font-size:15px;word-break:break-word}
.blk.cam{--bc:#0a84ff}.blk.aud{--bc:#bf5af2}.blk.dir{--bc:#ff9f0a}
.dl{display:flex;flex-direction:column;max-width:90%;align-self:flex-start}
.dl.r{align-self:flex-end;align-items:flex-end}
.dl .who{font-size:13px;font-weight:600;color:hsl(var(--h) 65% var(--wl));margin:0 6px 3px}
.dl .bub{background:hsl(var(--h) 55% 50%/.16);border:.5px solid hsl(var(--h) 55% 55%/.32);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:17px;line-height:1.45;font-weight:500;word-break:break-word}
.dl.r .bub{border-radius:18px 18px 6px 18px}
.dl .ex{font-size:13px;color:var(--mute);font-style:italic;margin:3px 8px 0}
.ps{align-self:center;font-size:12.5px;color:var(--mute);padding:3px 12px;border-radius:999px;background:var(--act)}

function initFx(){

  if(ok&&fxOn()){try{const m=$("#lensmap");if(!m.getAttribute("href"))m.setAttribute("href",lensMap());h.classList.add("fx")}catch{h.classList.remove("fx")}}else h.classList.remove("fx");
}
const INSTANT=new Set(["tab","back","vtab","cancel","edit","unpick","open","wall","fx"]);
document.addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target;if(!H[f.dataset.form])return;
  const btn=ev.submitter||f.querySelector("button.btn")||(f.id&&document.querySelector('button[form="'+f.id+'"]'));
  if(btn&&btn.classList.contains("busy"))return;
  if(f.dataset.form!=="login")dropCache();
  try{await busy(btn,()=>H[f.dataset.form](f,ev))}catch(e){toast(e.message||"Terjadi kesalahan.")}});
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  try{if(INSTANT.has(a))await A[a](b);else{dropCache();await busy(b,()=>A[a](b))}}catch(e){toast(e.message||"Terjadi kesalahan.")}});
document.addEventListener("change",async ev=>{
  if(ev.target.id!=="wallfile")return;const f=ev.target.files[0];if(!f)return;
  try{const url=await shrink(f),a=await dominant(url).catch(()=>"");localStorage.setItem("kos_wall",JSON.stringify({t:"img",v:url,a}));applyWall();toast("Wallpaper diganti",1);render()}
  catch(e){toast("Foto tidak bisa dipakai: "+(e.name==="QuotaExceededError"?"penyimpanan penuh":"format tidak didukung"))}
});
document.addEventListener("input",ev=>{if(ev.target.id!=="q")return;const q=ev.target.value.toLowerCase();document.querySelectorAll(".row").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")});
async function start(){
  let session=null;
  try{session=(await Promise.race([sb.auth.getSession(),new Promise((_,r)=>setTimeout(()=>r(new Error("Koneksi ke Supabase lambat atau terblokir.")),6000))])).data.session}
  catch(e){toast(e.message)}
  if(!session)return loginView();
  user=session.user;
  try{
    let c=null;try{c=JSON.parse(localStorage.getItem("kos_pid")||"null")}catch{}
    const keep=p=>{pid=p;try{localStorage.setItem("kos_pid",JSON.stringify({u:user.id,p}))}catch{}};
    if(c&&c.u===user.id){pid=c.p;ensureProject().then(keep).catch(()=>{})}else keep(await ensureProject());
  }catch(e){toast((e.message||"Gagal")+" Jalankan dulu SQL migrasi di Supabase.")}
  history.replaceState({n:0},"");stack=[];hdepth=0;render(3);
}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
addEventListener("unhandledrejection",e=>toast(String(e.reason?.message||e.reason||"Terjadi kesalahan.")));
addEventListener("error",e=>{if($("#boot"))$("#app").innerHTML='<div class="empty">Aplikasi gagal dimuat: '+esc(e.message)+'</div>'});
applyWall();initFx();
start().catch(e=>toast(e.message||"Gagal memulai aplikasi."));
</script></body></html>
